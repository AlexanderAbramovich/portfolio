<link rel="stylesheet" href="shell.css">
<style>
  /* тема перекрашивает страницу плавно */
  html, body, .chip, .w-meta, .w-tags, .co-card p, .theme-note { transition:background-color .6s, color .6s, border-color .6s; }

  .pg-head { padding-bottom:3vh; }
  .w-sum { margin-top:3vh; display:flex; flex-wrap:wrap; gap:12px; }

  /* фильтры: липнут под шапкой */
  .filters { position:sticky; top:var(--hdr); z-index:5; display:flex; gap:8px; padding:14px 4vw; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 6vw),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 6vw),transparent); overflow-x:auto; scrollbar-width:none;
    background:color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter:blur(16px) saturate(1.6); backdrop-filter:blur(16px) saturate(1.6); transition:background-color .6s; }
  .filters::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 15px; border-radius:22px; cursor:pointer;
    font:600 12px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; color:var(--fg); background:none; border:1.5px solid var(--line); }
  .chip small { font:500 11px 'Golos Text', system-ui, sans-serif; color:var(--fg2); }
  .chip:hover { border-color:var(--fg); }
  .chip { position:relative; z-index:1; transition:color .35s, border-color .35s; }
  .chip[aria-pressed="true"] { color:var(--bg); border-color:transparent; }
  .chip-ind { position:absolute; top:14px; left:0; height:40px; border-radius:22px; background:var(--fg); z-index:0; pointer-events:none;
    transition:transform .55s cubic-bezier(.3,1.35,.4,1), width .55s cubic-bezier(.3,1.35,.4,1), background-color .6s; }
  @media (max-width:820px) { .chip-ind { top:10px; } }
  .chip[aria-pressed="true"] small { color:inherit; opacity:.7; }

  /* работы с компаниями: три крупные карточки */
  .co-sec { padding:6vh 4vw 10vh; }
  .sec-h { display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:3vh; }
  .sec-h h2 { font:400 clamp(32px,4.6vw,84px)/1 'Dela Gothic One', 'Arial Black', sans-serif; letter-spacing:-.04em; text-transform:uppercase; }
  .sec-h p { font:500 15px 'Golos Text', system-ui, sans-serif; color:var(--fg2); transition:color .6s; }
  .co-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:2vw; }
  .co-card { display:block; }
  .co-card .pic { border-radius:14px; overflow:hidden; box-shadow:0 22px 50px rgba(11,10,12,.16); transition:transform .6s cubic-bezier(.2,.8,.2,1.2); }
  .co-card img { width:100%; height:auto; transition:transform .8s cubic-bezier(.2,.75,.15,1); }
  .co-card h3 { margin-top:18px; font:400 clamp(24px,2.2vw,40px)/1 'Dela Gothic One', 'Arial Black', sans-serif; letter-spacing:-.035em; text-transform:uppercase; transition:color .4s; }
  .co-card p { margin-top:8px; font:400 15px/1.45 'Golos Text', system-ui, sans-serif; color:var(--fg2); }
  .co-card:hover .pic, .co-card:focus-visible .pic { transform:translateY(-6px) rotate(-.6deg); }
  .co-card:hover img { transform:scale(1.04); }
  .co-card:hover h3, .co-card:focus-visible h3 { color:var(--acc); }

  /* все работы: сетка, обложки в своей пропорции */
  .w-sec { padding:8vh 4vw 12vh; border-top:1.5px solid var(--fg); margin:0 4vw; padding-left:0; padding-right:0; transition:border-color .6s; }
  .w-sec .filters { margin:0 -4vw 4vh; }
  .w-sec .grid { margin-top:1vh; }
  .grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:5vh 2vw; align-items:start; }
  .w { display:block; }
  .w .pic { position:relative; border-radius:12px; overflow:hidden; background:var(--bg2); box-shadow:0 14px 34px rgba(11,10,12,.12); transition:transform .5s cubic-bezier(.2,.8,.2,1.2), box-shadow .5s; }
  .w img { width:100%; height:auto; transition:transform .8s cubic-bezier(.2,.75,.15,1); }
  .w .live { position:absolute; right:10px; top:10px; padding:6px 10px; border-radius:16px; font:600 10px 'Unbounded', 'Arial', sans-serif; color:#fff;
    background:rgba(20,16,24,.45); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
  .w-meta { margin-top:14px; display:flex; gap:10px; font:600 11px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; color:var(--fg2); }
  .w-meta b { color:var(--acc); font-weight:600; transition:color .6s; }
  .w h3 { margin-top:8px; font:600 clamp(17px,1.35vw,22px)/1.25 'Unbounded', 'Arial', sans-serif; letter-spacing:-.01em; transition:color .4s; }
  .w-tags { margin-top:8px; font:400 14px/1.4 'Golos Text', system-ui, sans-serif; color:var(--fg2); }
  .w:hover .pic, .w:focus-visible .pic { transform:translateY(-6px); box-shadow:0 26px 50px rgba(11,10,12,.2); }
  .w:hover img { transform:scale(1.04); }
  .w:hover h3, .w:focus-visible h3 { color:var(--acc); }
  .w.hide { display:none; }
  .empty { padding:8vh 0; font:500 18px 'Golos Text', system-ui, sans-serif; color:var(--fg2); }

  /* подсказка о фишке: страница в цветах проекта */
  .theme-note { position:fixed; left:4vw; bottom:22px; z-index:6; display:flex; align-items:center; gap:10px; padding:10px 16px 10px 12px; border-radius:22px;
    font:600 11px 'Unbounded', 'Arial', sans-serif; color:var(--fg); background:color-mix(in srgb, var(--bg) 70%, transparent);
    -webkit-backdrop-filter:blur(16px) saturate(1.6); backdrop-filter:blur(16px) saturate(1.6); box-shadow:inset 0 0 0 1px var(--line), 0 10px 26px rgba(11,10,12,.12);
    opacity:0; transform:translateY(10px); transition:opacity .35s, transform .35s, background-color .6s, color .6s; pointer-events:none; }
  .theme-note.on { opacity:1; transform:none; }
  .theme-note i { width:14px; height:14px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 3px var(--bg2); transition:background-color .6s, box-shadow .6s; }

  @media (max-width:1100px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:420px) { .w-sum .pill { white-space:normal; line-height:1.35; } }
  @media (max-width:820px) {
    .co-grid { grid-template-columns:1fr; gap:5vh; }
    .grid { grid-template-columns:1fr; gap:6vh; }
    .filters { padding:10px 4vw; }
    .theme-note { left:12px; bottom:12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html, body, .chip, .w-meta, .w-tags, .co-card p, .theme-note, .filters, header { transition:none; }
    .w .pic, .w img, .co-card .pic, .co-card img { transition:none; }
  }
</style>

<body>

<header id="hdr">
  <a class="logo" href="./" aria-label="Александр Абрамович, на главную">А<i>А</i></a>

  <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">Меню<i aria-hidden="true"></i></button>
  <nav class="nav" id="nav" aria-label="Разделы">
    <a href="./">главная</a>
    <a href="works.html" aria-current="page">работы</a>
    <a href="services.html">услуги</a>
    <a href="contacts.html">контакты</a>
  </nav>
</header>

<main>
  <section class="pg-head">
    <div class="pg-tag rv">Александр Абрамович<em>графический дизайнер · Иркутск</em></div>
    <h1 class="pg-h rv">Работы<sup id="total"></sup></h1>
    <div class="w-sum rv"><span class="pill status">беру в работу</span><span class="pill" id="hint">наведите на проект — сайт примет его цвета</span></div>
  </section>

  <section class="co-sec" id="companies" aria-labelledby="coH">
    <div class="sec-h rv"><h2 id="coH">Работы с компаниями</h2><p id="coSub"></p></div>
    <div class="co-grid" id="coGrid"></div>
  </section>

  <section class="w-sec" id="cats" aria-labelledby="catH">
    <div class="sec-h cat-h rv"><h2 id="catH">Категории</h2></div>
    <div class="filters" id="filters" role="toolbar" aria-label="Фильтр по направлениям"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>В этом направлении пока нет работ.</p>
  </section>
</main>
<div class="theme-note" id="note" aria-hidden="true"><i></i><span id="noteTxt"></span></div>
<footer><span>© 2026 Александр Абрамович</span><span>Иркутск · работаю по всей России</span></footer>

<script src="shell.js"></script>
<script>
const { $, data, reveal, IS_TOUCH, RM } = Shell;
const CASE = Shell.CASE, CASE_TAB = Shell.CASE_TAB;
const ORDER = ['web', 'presentation', 'marketplace', 'outdoor', 'identity', 'ai', 'motion', 'youtube', 'social'];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const first = (s) => { const m = String(s || '').match(/^.*?[.!?](\s|$)/); return (m ? m[0] : s).trim(); };
const caseHref = (id) => CASE + id;
const cur = (w) => w.theme ? ` data-cbg="${w.theme.bg}" data-cfg="${w.theme.accent}"` : '';   // шторка перехода — в цветах проекта
const tgt = CASE_TAB ? ` target="${CASE_TAB}" rel="noopener"` : '';

/* ---------- тема: страница принимает цвета проекта (как кейс на сайте) ---------- */
const DEF = { bg: '#F4F2F5', bg2: '#ECE9EE', card: '#FFFFFF', text: '#0B0A0C', textMuted: '#6E6670', accent: '#E8102A', line: 'rgba(11,10,12,.14)' };
const VARS = { bg: '--bg', bg2: '--bg2', card: '--card', text: '--fg', textMuted: '--fg2', accent: '--acc', line: '--line' };
const root = document.documentElement;
let curTheme = null, noteT = 0;
// возврат кнопкой «назад» из кэша: тема прошлого наведения не должна остаться — курсор перекрасит заново, если он над карточкой
addEventListener('pageshow', (e) => { if (e.persisted) applyTheme(null); });
function applyTheme(w){
  const key = w && w.theme ? w.id : null;
  if (key === curTheme) return;
  curTheme = key;
  const t = (w && w.theme) || DEF;
  for (const k in VARS) root.style.setProperty(VARS[k], t[k] || DEF[k]);
  $('noteTxt').textContent = key ? 'цвета проекта: ' + w.title : '';
  $('note').classList.toggle('on', !!key);
  clearTimeout(noteT);
  if (key && (IS_TOUCH || innerWidth <= 820)) noteT = setTimeout(() => $('note').classList.remove('on'), 2000);   // на телефоне не закрываем подписи
}

if (IS_TOUCH || !matchMedia('(min-width:821px)').matches) $('hint').textContent = 'листайте — сайт примет цвета проекта';

data().then((d) => {
  const works = d.works, byId = Object.fromEntries(works.map((w) => [w.id, w]));
  const companies = works.filter((w) => w.category === 'campaign');
  const regular = works.filter((w) => w.category !== 'campaign');
  $('total').textContent = works.length;
  $('coSub').textContent = d.worksText.companiesSub;

  /* компании */
  $('coGrid').innerHTML = companies.map((w, i) => `
    <a class="co-card rv" style="transition-delay:${i * .08}s" href="${caseHref(w.id)}"${tgt} data-id="${w.id}"${cur(w)}>
      <div class="pic"><img src="${w.cover}" alt="${esc(w.title)}" loading="lazy"></div>
      <h3>${esc(w.title)}</h3><p>${esc(first(w.description))}</p>
    </a>`).join('');

  /* все работы */
  $('grid').innerHTML = regular.map((w) => `
    <a class="w rv" href="${caseHref(w.id)}"${tgt} data-id="${w.id}" data-cat="${w.category}"${cur(w)}>
      <div class="pic"><img src="${w.cover}" alt="${esc(w.title)}" loading="lazy">${w.liveUrl ? '<span class="live">живой сайт</span>' : ''}</div>
      <div class="w-meta"><b>${esc(d.categories[w.category] || '')}</b><span>${w.year || ''}</span></div>
      <h3>${esc(w.title)}</h3>
      <div class="w-tags">${esc((w.tags || []).join(' · '))}</div>
    </a>`).join('');

  /* фильтры: только направления, где есть работы */
  const cats = ['all', ...ORDER.filter((c) => regular.some((w) => w.category === c))];
  const count = (c) => c === 'all' ? regular.length : regular.filter((w) => w.category === c).length;
  $('filters').innerHTML = cats.map((c) => `<button class="chip" type="button" data-cat="${c}" aria-pressed="false">${esc(d.worksText.filters[c].toLowerCase())} <small>${count(c)}</small></button>`).join('');
  const cards = [...document.querySelectorAll('.w')];
  const ind = document.createElement('span'); ind.className = 'chip-ind'; ind.setAttribute('aria-hidden', 'true'); $('filters').prepend(ind);
  const moveInd = () => { const b = document.querySelector('.chip[aria-pressed="true"]'); if (!b) return; ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; };
  addEventListener('resize', moveInd); document.fonts.ready.then(moveInd);
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  let curCat = null, busy = 0;
  function apply(c){
    cards.forEach((el) => el.classList.toggle('hide', c !== 'all' && el.dataset.cat !== c));
    $('empty').hidden = cards.some((el) => !el.classList.contains('hide'));
    cards.forEach((el) => el.classList.add('in'));          // отфильтрованные не ждут прокрутки для появления
    Shell.relayout();
  }
  function setCat(c, push){
    if (!cats.includes(c)) c = 'all';
    if (c === curCat) return;
    const first = curCat === null; curCat = c;
    document.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === c)));
    moveInd();
    if (push) history.replaceState(null, '', c === 'all' ? location.pathname : '?cat=' + c);
    if (first || RM.matches) { apply(c); return; }
    // уход: видимые карточки опускаются и размываются; приход: новые вылетают снизу лесенкой
    const vis = cards.filter((el) => !el.classList.contains('hide') && el.getBoundingClientRect().top < innerHeight + 200);
    vis.forEach((el, i) => el.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(28px) scale(.97)', filter: 'blur(6px)' }],
      { duration: 240, delay: Math.min(i, 8) * 18, easing: 'ease-in', fill: 'forwards' }));
    const my = ++busy;
    setTimeout(() => {
      if (my !== busy) return;
      cards.forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
      apply(c);
      cards.filter((el) => !el.classList.contains('hide')).forEach((el, i) => {
        const r = (i % 3 - 1) * 2.5;
        el.animate([{ opacity: 0, transform: `translateY(70px) rotate(${r}deg) scale(.94)`, filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
          { duration: 760, delay: Math.min(i, 11) * 55, easing: EASE, fill: 'backwards' });
      });
    }, 300);
  }
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    setCat(b.dataset.cat, true);
    const top = $('cats').getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(root).getPropertyValue('--hdr'));
    if (scrollY > top) scrollTo({ top, behavior: RM.matches ? 'auto' : 'smooth' });
  });
  setCat(new URLSearchParams(location.search).get('cat') || 'all', false);
  reveal(); document.fonts.ready.then(Shell.fit);

  /* смена темы: на компьютере — под курсором, на телефоне — проект в середине экрана */
  const all = [...document.querySelectorAll('[data-id]')];
  if (!IS_TOUCH && matchMedia('(min-width:821px)').matches) {
    let tIn = 0, tOut = 0;
    all.forEach((el) => {
      const on = () => { clearTimeout(tOut); clearTimeout(tIn); tIn = setTimeout(() => applyTheme(byId[el.dataset.id]), 90); };
      const off = () => { clearTimeout(tIn); clearTimeout(tOut); tOut = setTimeout(() => applyTheme(null), 350); };
      el.addEventListener('pointerenter', on); el.addEventListener('focus', on);
      el.addEventListener('pointerleave', off); el.addEventListener('blur', off);
    });
  } else {
    const seen = new Set();
    const io = new IntersectionObserver((es) => {
      es.forEach((en) => en.isIntersecting ? seen.add(en.target) : seen.delete(en.target));
      const vis = [...seen].filter((el) => !el.classList.contains('hide'));
      applyTheme(vis.length ? byId[vis[0].dataset.id] : null);
    }, { rootMargin: '-48% 0px -48% 0px' });
    all.forEach((el) => io.observe(el));
  }
});
</script>
