<link rel="stylesheet" href="shell.css">
<style>
  /* кейс целиком в цветах проекта: тема ставится на :root до первой отрисовки */
  html, body { transition:background-color .6s, color .6s; }

  .c-head { padding:calc(var(--hdr) + 7vh) 4vw 6vh; }
  .back { display:flex; width:max-content; align-items:center; gap:10px; margin-bottom:5vh; padding:8px 0; font:600 12px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; }
  .back span[aria-hidden] { font:400 18px 'Golos Text', system-ui, sans-serif; transition:transform .3s; }
  .back:hover { color:var(--acc); } .back:hover span[aria-hidden] { transform:translateX(-5px); }
  .c-cat { display:inline-block; margin-bottom:2.4vh; font:600 12px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; color:var(--acc); }
  .c-title { font:400 clamp(44px,8.4vw,160px)/.94 'Dela Gothic One', 'Arial Black', sans-serif; letter-spacing:-.045em; text-transform:uppercase; max-width:18ch; }
  .c-meta { margin-top:4vh; display:flex; flex-wrap:wrap; gap:10px; }
  .c-meta span { font:500 13px 'Unbounded', 'Arial', sans-serif; padding:10px 16px; border-radius:30px; border:1.5px solid var(--line); }

  /* обложка-кнопка: живой сайт, ролик или презентация */
  .c-hero { padding:0 4vw 8vh; }
  .c-hero > * { position:relative; display:block; width:100%; border:0; padding:0; background:none; cursor:pointer; border-radius:18px; overflow:hidden;
    box-shadow:0 30px 70px rgba(11,10,12,.22); }
  .c-hero img { width:100%; height:auto; transition:transform 1.1s cubic-bezier(.2,.75,.15,1); }
  .c-hero > *:hover img { transform:scale(1.025); }
  .badge { position:absolute; right:18px; bottom:18px; display:inline-flex; align-items:center; gap:12px; padding:14px 20px; border-radius:30px; color:#fff;
    font:600 13px 'Unbounded', 'Arial', sans-serif; background:rgba(20,16,24,.42); -webkit-backdrop-filter:blur(16px) saturate(1.8); backdrop-filter:blur(16px) saturate(1.8);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4), inset 0 8px 16px rgba(255,255,255,.12); transition:background .3s; }
  .c-hero > *:hover .badge { background:var(--acc); }

  /* о проекте: описание, этапы */
  .c-info { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:5vw; padding:4vh 4vw 10vh; }
  .c-desc { font:400 clamp(20px,1.9vw,32px)/1.38 'Golos Text', system-ui, sans-serif; }
  .facts-l { list-style:none; border-top:1.5px solid var(--line); }
  .facts-l li { display:grid; grid-template-columns:110px minmax(0,1fr); gap:16px; padding:16px 0; border-bottom:1.5px solid var(--line); }
  .facts-l b { font:600 11px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; color:var(--fg2); padding-top:3px; }
  .facts-l span { font:500 16px/1.4 'Golos Text', system-ui, sans-serif; }
  .facts-l a { text-decoration:underline; text-underline-offset:4px; }
  .facts-l a:hover { color:var(--acc); }
  .steps { grid-column:1 / -1; }
  .steps h2, .blk-h h2, .next small { font:600 12px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; color:var(--acc); }
  .steps ol { margin-top:3vh; list-style:none; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:2vw; counter-reset:s; }
  .steps li { counter-increment:s; padding-top:18px; border-top:1.5px solid var(--fg); font:400 17px/1.45 'Golos Text', system-ui, sans-serif; }
  .steps li::before { content:counter(s, decimal-leading-zero); display:block; margin-bottom:12px; font:400 clamp(28px,2.6vw,44px)/1 'Dela Gothic One', 'Arial Black', sans-serif; color:var(--acc); }

  /* галерея: блоки по носителям */
  .blocks { padding:0 4vw 12vh; display:grid; gap:12vh; }
  .blk-h { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:baseline; gap:2vw; padding-bottom:2.4vh; margin-bottom:3vh; border-bottom:1.5px solid var(--fg); }
  .blk-h .n { font:400 clamp(22px,2vw,34px) 'Dela Gothic One', 'Arial Black', sans-serif; color:var(--acc); }
  .blk-h h3 { font:400 clamp(26px,3.2vw,60px)/1 'Dela Gothic One', 'Arial Black', sans-serif; letter-spacing:-.035em; text-transform:uppercase; }
  .blk-h .k { font:600 12px 'Unbounded', 'Arial', sans-serif; color:var(--fg2); }
  .note { max-width:820px; margin:-1vh 0 3vh; font:400 17px/1.5 'Golos Text', system-ui, sans-serif; color:var(--fg2); }
  .sub-l { display:block; margin:4vh 0 2vh; font:600 11px 'Unbounded', 'Arial', sans-serif; text-transform:lowercase; color:var(--fg2); }
  .sub-l.red { color:var(--acc); }

  .tile { position:relative; display:block; overflow:hidden; border-radius:10px; background:var(--bg2); cursor:zoom-in; border:0; padding:0; }
  .tile img { width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.75,.15,1); }
  .tile:hover img { transform:scale(1.03); }
  .jrows { display:grid; gap:16px; }
  .jrow { display:flex; gap:16px; }
  .jrow .tile { flex:0 0 auto; }
  .g-story { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
  .g-story .tile { aspect-ratio:9/16; }
  .g-3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; align-items:start; }
  .g-card { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
  .g-card .tile { aspect-ratio:3/4; }
  .g-masonry { columns:2; column-gap:16px; } .g-masonry .tile { margin-bottom:16px; height:auto; } .g-masonry .tile img { height:auto; }

  /* было / стало */
  .pairs { display:grid; gap:4vh; }
  .pairs.cols { grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); gap:2vw; }
  .ba { position:relative; width:100%; max-height:var(--maxh,560px); aspect-ratio:var(--ar); margin:0 auto; overflow:hidden; border-radius:12px; touch-action:pan-y; cursor:ew-resize; user-select:none; background:var(--bg2);
    max-width:calc(var(--maxh,560px) * var(--ar)); }
  .ba img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .ba .before { clip-path:inset(0 calc(100% - var(--p,50%)) 0 0); }
  .ba .bar { position:absolute; top:0; bottom:0; left:var(--p,50%); width:2px; margin-left:-1px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.15); }
  .ba .knob { position:absolute; top:50%; left:var(--p,50%); width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; display:grid; place-items:center; color:#fff;
    background:rgba(20,16,24,.4); -webkit-backdrop-filter:blur(12px) saturate(1.8); backdrop-filter:blur(12px) saturate(1.8); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7); font:600 16px 'Golos Text', system-ui, sans-serif; }
  .ba:focus-visible { outline:2px solid var(--acc); outline-offset:4px; }
  .ba .tag, .pair-h .tag { position:absolute; top:12px; padding:7px 12px; border-radius:16px; font:600 11px 'Unbounded', 'Arial', sans-serif; color:#fff; background:rgba(20,16,24,.5);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); pointer-events:none; }
  .ba .tag.l { left:12px; } .ba .tag.r { right:12px; background:var(--acc); }
  .pair-two { display:flex; gap:16px; justify-content:center; }
  .pair-h { position:relative; flex:0 0 auto; border-radius:10px; overflow:hidden; }
  .pair-h img { width:100%; height:100%; object-fit:cover; }
  .pair-h .tag { left:12px; } .pair-h.after .tag { background:var(--acc); }
  figcaption { margin-top:12px; font:400 15px/1.45 'Golos Text', system-ui, sans-serif; color:var(--fg2); text-align:center; }

  /* ролики */
  .vids { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,420px), 1fr)); gap:16px; }
  .vids.story { grid-template-columns:repeat(4, minmax(0,1fr)); }
  .vids.story .vt { aspect-ratio:9/16; }
  .vt { position:relative; display:block; width:100%; aspect-ratio:16/9; border:0; padding:0; border-radius:12px; overflow:hidden; background:#000; cursor:pointer; }
  .vt img { width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.75,.15,1); }
  .vt:hover img { transform:scale(1.03); }
  .vt .badge { left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%); }

  /* лист слайдов / экранов */
  .sheet { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; }
  .sheet .tile { aspect-ratio:var(--sar,16/9); cursor:pointer; }
  .sheet .num { position:absolute; left:10px; top:10px; padding:5px 9px; border-radius:12px; font:600 10px 'Unbounded', 'Arial', sans-serif; color:#fff; background:rgba(20,16,24,.5); }
  .g-plain { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; align-items:start; }
  .g-plain.one { grid-template-columns:1fr; max-width:1100px; }
  .g-plain .tile img, .g-3 .tile img { height:auto; }

  /* следующий проект — полоса в цветах следующего проекта */
  .next { position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.7fr); align-items:center; gap:4vw; padding:9vh 4vw; overflow:hidden;
    background:var(--nbg); color:var(--nfg); }
  .next small { color:var(--nacc); }
  .next > div { min-width:0; }
  .next b { display:block; margin-top:2vh; font:400 clamp(34px,5.6vw,108px)/.98 'Dela Gothic One', 'Arial Black', sans-serif; letter-spacing:-.045em; text-transform:uppercase; }
  .next .arr { display:inline-block; margin-top:3vh; font:400 clamp(28px,3vw,50px) 'Golos Text', system-ui, sans-serif; color:var(--nacc); transition:transform .4s; }
  .next img { border-radius:14px; box-shadow:0 30px 60px rgba(0,0,0,.28); transform:rotate(2deg); transition:transform .8s cubic-bezier(.2,.8,.2,1.2); }
  .next:hover img { transform:rotate(0) scale(1.03); }
  .next:hover .arr { transform:translateX(12px); }

  /* оверлеи: лайтбокс, презентация, ролик */
  .ov { position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(8,7,9,.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .ov[hidden] { display:none; }
  .ov img, .ov video { max-width:92vw; max-height:84vh; width:auto; height:auto; border-radius:8px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .ov-x, .ov-p, .ov-n { position:absolute; display:grid; place-items:center; width:52px; height:52px; border-radius:50%; border:0; cursor:pointer; color:#fff; font:400 26px 'Golos Text', system-ui, sans-serif;
    background:rgba(255,255,255,.1); box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); }
  .ov-x:hover, .ov-p:hover, .ov-n:hover { background:var(--red); }
  .ov-x { top:20px; right:20px; } .ov-p { left:20px; top:50%; margin-top:-26px; } .ov-n { right:20px; top:50%; margin-top:-26px; }
  .ov-c { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); font:600 12px 'Unbounded', 'Arial', sans-serif; color:#ddd; }

  .missing { padding:20vh 4vw; }
  .missing a { color:var(--acc); text-decoration:underline; }

  @media (max-width:1100px) {
    .steps ol { grid-template-columns:repeat(2, minmax(0,1fr)); row-gap:4vh; }
    .g-story, .vids.story, .g-card { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .sheet { grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  @media (max-width:900px) {
    .c-info { grid-template-columns:1fr; }
    .g-3, .g-plain, .pairs.cols { grid-template-columns:1fr; }
    .g-story, .vids.story, .g-card { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .g-masonry { columns:1; }
    .next { grid-template-columns:1fr; }
  }
  @media (max-width:820px) {
    .c-head { padding-top:calc(var(--hdr) + 5vh); }
    .c-title { font-size:clamp(34px,11vw,72px); }
    .badge { right:10px; bottom:10px; padding:10px 14px; font-size:11px; }
    .steps ol { grid-template-columns:1fr; }
    .blk-h { grid-template-columns:auto minmax(0,1fr); }
    .blk-h .k { display:none; }
    .sheet { grid-template-columns:1fr 1fr; gap:10px; }
    .pair-two { flex-direction:column; }
    .pair-h { width:100% !important; height:auto !important; } .pair-h img { height:auto; }
    .ov-p, .ov-n { top:auto; bottom:12px; margin-top:0; }
  }
  @media (prefers-reduced-motion: reduce) { html, body { transition:none; } .tile img, .c-hero img, .next img, .vt img { transition:none; } }
</style>

<script>
const { $, reveal } = Shell;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const id = new URLSearchParams(location.search).get('id');
const DEF = { bg: '#F4F2F5', bg2: '#ECE9EE', card: '#FFFFFF', text: '#0B0A0C', textMuted: '#6E6670', accent: '#E8102A', line: 'rgba(11,10,12,.14)' };
const VARS = { bg: '--bg', bg2: '--bg2', card: '--card', text: '--fg', textMuted: '--fg2', accent: '--acc', line: '--line' };
const themeOf = (p) => Object.assign({}, DEF, (p && p.theme) || {});

fetch('cases.json').then((r) => r.json()).then(({ cases, categories, ar: AR }) => {
  const idx = cases.findIndex((c) => c.id === id);
  if (idx < 0) { $('main').innerHTML = '<div class="missing"><h1 class="c-title">Не нашёл кейс</h1><p class="c-desc" style="margin-top:3vh"><a href="works.html">Все работы →</a></p></div>'; return; }
  const p = cases[idx], next = cases[(idx + 1) % cases.length];
  const arOf = (src) => AR[String(src).replace(/^\.\.\//, '')] || 4 / 3;

  /* тема проекта на всю страницу */
  const t = themeOf(p), root = document.documentElement;
  for (const k in VARS) root.style.setProperty(VARS[k], t[k]);
  document.title = p.title + ' — Александр Абрамович';

  const cat = categories[p.category] || '';
  const firstVideo = (p.sections || []).flatMap((s) => s.videos || [])[0] || null;
  const isDeck = ['presentation', 'identity'].includes(p.category) && p.images.length > 1;
  const isSheet = ['presentation', 'identity', 'web'].includes(p.category) && p.images.length > 1;
  const gal = [];                                            // плоский список картинок для лайтбокса
  const tile = (src, alt, style = '') => { const i = gal.push(src) - 1; return `<button class="tile" type="button" data-lb="${i}" style="${style}"><img src="${src}" alt="${esc(alt)}" loading="lazy"></button>`; };

  /* шапка кейса */
  let h = `<section class="c-head">
    <a class="back" href="works.html"><span aria-hidden="true">←</span>все работы</a>
    <div class="c-cat rv">${esc(cat)}</div>
    <h1 class="c-title rv">${esc(p.title)}</h1>
    <div class="c-meta rv">${[p.location, p.year, ...(p.tags || [])].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join('')}</div>
  </section>`;

  /* обложка-кнопка */
  if (p.liveUrl) h += `<section class="c-hero rv"><a href="${esc(p.liveUrl)}" target="_blank" rel="noopener"><img src="${p.cover}" alt="${esc(p.title)}"><span class="badge">Открыть живой сайт ↗</span></a></section>`;
  else if (firstVideo) h += `<section class="c-hero rv"><button type="button" data-vid="${esc(firstVideo)}"><img src="${p.cover}" alt="${esc(p.title)}"><span class="badge">Смотреть ролик ▸</span></button></section>`;
  else if (isDeck) h += `<section class="c-hero rv"><button type="button" data-deck="0"><img src="${p.cover}" alt="${esc(p.title)}"><span class="badge">Посмотреть презентацию ▸</span></button></section>`;

  /* о проекте */
  h += `<section class="c-info">
    <p class="c-desc rv">${esc(p.description)}</p>
    <ul class="facts-l rv">
      <li><b>год</b><span>${esc(p.year)}</span></li>
      <li><b>направление</b><span>${esc(cat)}</span></li>
      ${p.tags.length ? `<li><b>что внутри</b><span>${esc(p.tags.join(' · '))}</span></li>` : ''}
      ${p.liveUrl ? `<li><b>сайт</b><span><a href="${esc(p.liveUrl)}" target="_blank" rel="noopener">${esc(p.location || p.liveUrl)}</a></span></li>` : ''}
    </ul>
    ${p.steps ? `<div class="steps rv"><h2>этапы работы</h2><ol>${p.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></div>` : ''}
  </section>`;

  /* галерея */
  const rowsSpecs = [];                                      // ряды «одной высоты» считаются после вставки, по ширине
  if (p.sections) {
    h += '<section class="blocks">';
    p.sections.forEach((sec, si) => {
      const clean = sec.images || [], photos = sec.photos || [], pairs = sec.pairs || [], vids = sec.videos || [];
      const total = clean.length + photos.length + pairs.length + vids.length;
      const uniform = sec.layout === 'story' ? 'g-story' : sec.layout === 'grid3' ? 'g-3' : p.gridRatio === 'card' ? 'g-card' : sec.layout === 'masonry' ? 'g-masonry' : null;
      const opts = { maxH: sec.layout === 'tall' ? 680 : sec.layout === 'logo' ? 240 : 520, target: sec.layout === 'tall' ? .9 : sec.layout === 'full' ? .01 : 2.4,
        narrow: sec.layout === 'logo' ? 1.9 : .01, minRowH: sec.pack === 'free' ? 0 : 150, maxSpread: sec.pack === 'free' ? 99 : 3 };
      const group = (list, alt) => {
        if (uniform) return `<div class="${uniform}">${list.map((s, i) => tile(s, `${p.title} — ${sec.title} — ${i + 1}`, uniform === 'g-3' && sec.ar ? `aspect-ratio:${sec.ar}` : '')).join('')}</div>`;
        const k = rowsSpecs.push({ items: list.map((s) => ({ src: s, ar: arOf(s), i: gal.push(s) - 1, alt })), opts }) - 1;
        return `<div class="jrows" data-rows="${k}"></div>`;
      };
      h += `<div class="blk">
        <div class="blk-h rv"><span class="n">${pad(si + 1)}</span><h3>${esc(sec.title)}</h3><span class="k">${total}</span></div>
        ${sec.note ? `<p class="note rv">${esc(sec.note)}</p>` : ''}`;
      if (vids.length) h += `<div class="vids ${sec.layout === 'story' ? 'story' : ''} rv">${vids.map((v, i) =>
        `<button class="vt" type="button" data-vid="${esc(v)}">${sec.posters && sec.posters[i] ? `<img src="${sec.posters[i]}" alt="${esc(p.title + ' — ' + sec.title + ' — ' + (i + 1))}" loading="lazy">` : ''}<span class="badge">Смотреть ▸</span></button>`).join('')}</div>`;
      if (pairs.length) h += `<div class="pairs ${sec.pairCols ? 'cols' : ''}" style="${sec.pairCols ? '--cols:' + sec.pairCols : ''}">${pairs.map((pr) => {
        const cap = pr.what ? `<figcaption>${esc(pr.what)}</figcaption>` : '';
        if (pr.mode === 'pair') {
          const k = rowsSpecs.push({ pair: [{ src: pr.before, ar: arOf(pr.before), tag: 'было' }, { src: pr.after, ar: arOf(pr.after), tag: 'стало', after: true }] }) - 1;
          return `<figure class="rv"><div class="pair-two" data-rows="${k}"></div>${cap}</figure>`;
        }
        return `<figure class="rv"><div class="ba" tabindex="0" role="slider" aria-label="Было и стало" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
          style="--ar:${arOf(pr.after)};--maxh:${sec.pairCols ? 900 : 560}px"><img src="${pr.after}" alt="стало" loading="lazy"><img class="before" src="${pr.before}" alt="было" loading="lazy">
          <span class="bar"></span><span class="knob" aria-hidden="true">⇔</span><span class="tag l">было</span><span class="tag r">стало</span></div>${cap}</figure>`;
      }).join('')}</div>`;
      if (photos.length) h += `<span class="sub-l red">готовый носитель</span>${group(photos, 'фото')}`;
      if (clean.length) h += `${pairs.length ? '<span class="sub-l">чистовик</span>' : ''}${group(clean, 'макет')}`;
      h += '</div>';
    });
    h += '</section>';
  } else if (isSheet) {
    const counts = {}; p.images.forEach((s) => { const k = arOf(s).toFixed(2); counts[k] = (counts[k] || 0) + 1; });
    const sar = Number(Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0]);
    h += `<section class="blocks"><div class="blk"><div class="blk-h rv"><span class="n">01</span><h3>${p.category === 'web' ? 'Экраны' : 'Слайды'}</h3><span class="k">${p.images.length}</span></div>
      <div class="sheet" style="--sar:${sar}">${p.images.map((s, i) => `<button class="tile rv" type="button" data-deck="${i}"><img src="${s}" alt="${esc(p.title + ' — ' + (i + 1))}" loading="lazy"><span class="num">${pad(i + 1)}</span></button>`).join('')}</div></div></section>`;
  } else if (p.images.length) {
    const one = ['identity', 'presentation', 'web'].includes(p.category);
    h += `<section class="blocks"><div class="blk"><div class="blk-h rv"><span class="n">01</span><h3>Галерея</h3><span class="k">${p.images.length}</span></div>
      <div class="g-plain ${one ? 'one' : ''}">${p.images.map((s, i) => tile(s, p.title + ' — ' + (i + 1))).join('')}</div></div></section>`;
  }

  /* следующий проект — в его цветах */
  const nt = themeOf(next);
  h += `<a class="next" href="case.html?id=${next.id}" data-cbg="${nt.bg}" data-cfg="${nt.accent}" style="--nbg:${nt.bg};--nfg:${nt.text};--nacc:${nt.accent}">
    <div><small>следующий проект</small><b>${esc(next.title)}</b><span class="arr" aria-hidden="true">→</span></div>
    <img src="${next.cover}" alt="" loading="lazy"></a>`;
  $('main').innerHTML = h;

  /* ряды одной высоты: как на сайте, пересчёт по ширине */
  const layRows = () => document.querySelectorAll('[data-rows]').forEach((el) => {
    const spec = rowsSpecs[+el.dataset.rows], W = el.clientWidth, gap = 16;
    if (!W) return;
    if (spec.pair) {                                         // «было» и «стало» рядом, одна высота
      if (innerWidth <= 820) { el.innerHTML = spec.pair.map((it) => `<div class="pair-h ${it.after ? 'after' : ''}"><img src="${it.src}" alt="${it.tag}" loading="lazy"><span class="tag">${it.tag}</span></div>`).join(''); return; }
      const sum = spec.pair[0].ar + spec.pair[1].ar, hh = Math.min(640, (W - gap) / sum);
      el.innerHTML = spec.pair.map((it) => `<div class="pair-h ${it.after ? 'after' : ''}" style="width:${Math.round(hh * it.ar)}px;height:${Math.round(hh)}px"><img src="${it.src}" alt="${it.tag}" loading="lazy"><span class="tag">${it.tag}</span></div>`).join('');
      return;
    }
    const o = spec.opts, target = W < 620 ? o.narrow : o.target, rows = [];
    let row = [], sum = 0;
    for (const it of spec.items) {
      if (row.length) {
        const hh = (W - gap * row.length) / (sum + it.ar), ars = [...row.map((r) => r.ar), it.ar];
        if (hh < o.minRowH || Math.max(...ars) / Math.min(...ars) > o.maxSpread) { rows.push(row); row = []; sum = 0; }
      }
      row.push(it); sum += it.ar;
      if (sum >= target) { rows.push(row); row = []; sum = 0; }
    }
    if (row.length) rows.push(row);
    el.innerHTML = rows.map((r) => {
      const s = r.reduce((a, it) => a + it.ar, 0), hh = Math.min(o.maxH, Math.max(0, W - gap * (r.length - 1)) / s);
      const tw = hh * s + gap * (r.length - 1);
      return `<div class="jrow" style="justify-content:${tw < W - 1 ? 'center' : 'flex-start'}">${r.map((it) =>
        `<button class="tile" type="button" data-lb="${it.i}" style="width:${Math.round(hh * it.ar)}px;height:${Math.round(hh)}px"><img src="${it.src}" alt="${esc(p.title + ' — ' + it.alt)}" loading="lazy"></button>`).join('')}</div>`;
    }).join('');
  });
  layRows();
  let lw = innerWidth; addEventListener('resize', () => { if (innerWidth !== lw) { lw = innerWidth; layRows(); } });

  /* было / стало: тянуть мышью или пальцем, стрелки с клавиатуры */
  document.querySelectorAll('.ba').forEach((ba) => {
    const set = (v) => { v = Math.max(0, Math.min(100, v)); ba.style.setProperty('--p', v + '%'); ba.setAttribute('aria-valuenow', Math.round(v)); };
    const at = (e) => { const r = ba.getBoundingClientRect(); set((e.clientX - r.left) / r.width * 100); };
    let drag = false;
    ba.addEventListener('pointerdown', (e) => { drag = true; ba.setPointerCapture(e.pointerId); at(e); });
    ba.addEventListener('pointermove', (e) => { if (drag || e.pointerType === 'mouse') at(e); });
    ba.addEventListener('pointerup', () => { drag = false; });
    ba.addEventListener('keydown', (e) => { const v = parseFloat(ba.getAttribute('aria-valuenow')); if (e.key === 'ArrowLeft') { set(v - 5); e.preventDefault(); } if (e.key === 'ArrowRight') { set(v + 5); e.preventDefault(); } });
  });

  /* лайтбокс и презентация: один просмотрщик, разные списки */
  let list = [], cur = 0, lastFocus = null;
  const ov = $('ovImg'), ovImg = $('ovImgEl'), ovC = $('ovImgC');
  const show = (i) => { cur = (i + list.length) % list.length; ovImg.src = list[cur]; ovImg.alt = p.title + ' — ' + (cur + 1); ovC.textContent = `${cur + 1} / ${list.length}`; };
  const open = (l, i) => { list = l; lastFocus = document.activeElement; show(i); ov.hidden = false; document.body.style.overflow = 'hidden'; ov.querySelector('[data-close]').focus(); };
  const close = (o) => { o.hidden = true; document.body.style.overflow = ''; const v = o.querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } if (lastFocus) lastFocus.focus(); };
  ov.addEventListener('click', (e) => { const s = e.target.closest('[data-step]'); if (s) show(cur + +s.dataset.step); else if (e.target === ov || e.target.closest('[data-close]')) close(ov); });
  let sx = null; ov.addEventListener('pointerdown', (e) => { sx = e.clientX; }); ov.addEventListener('pointerup', (e) => { if (sx !== null && Math.abs(e.clientX - sx) > 50) show(cur + (e.clientX < sx ? 1 : -1)); sx = null; });
  const vov = $('ovVid'), vel = $('ovVidEl');
  vov.addEventListener('click', (e) => { if (e.target === vov || e.target.closest('[data-close]')) close(vov); });
  addEventListener('keydown', (e) => {
    if (!ov.hidden) { if (e.key === 'Escape') close(ov); if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); }
    else if (!vov.hidden && e.key === 'Escape') close(vov);
  });
  $('main').addEventListener('click', (e) => {
    const lb = e.target.closest('[data-lb]'), dk = e.target.closest('[data-deck]'), vd = e.target.closest('[data-vid]');
    if (lb) open(gal, +lb.dataset.lb);
    else if (dk) open(p.images, +dk.dataset.deck);
    else if (vd) { lastFocus = vd; vel.src = vd.dataset.vid; vov.hidden = false; document.body.style.overflow = 'hidden'; vel.play().catch(() => {}); vov.querySelector('[data-close]').focus(); }
  });

  document.fonts.ready.then(Shell.fit);                 // длинное слово заголовка не вылезает: кегль подгоняется

  reveal(); Shell.relayout();
});
</script>
</body>
</html>
